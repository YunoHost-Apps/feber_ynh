#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "feber"
name = "Feber"
description.en = "Simple group calendar"
description.fr = "Calendrier de groupe simpliste"

version = "1.4.2~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "AGPL-3.0"
demo ="https://simonrepp.com/feber/demo/"
website = "https://simonrepp.com/feber/"
code = "https://codeberg.org/simonrepp/feber"
fund = "https://ko-fi.com/simonrepp"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "60K"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/feber"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://codeberg.org/simonrepp/feber/archive/1.4.2.tar.gz"
    sha256 = "eba3c07393053d134390c595c7859a935e1589a32cf37704ac2718e39cc44639"

    autoupdate.strategy = "latest_forgejo_tag"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "php8.5-mbstring, php8.5-intl"
